<section id="contact">
  <div class="bg-cream-light-color dark:bg-black-color py-60px md:py-20 lg:py-100px xl:py-30">
    <div class="container">
      <div class="flex flex-col-reverse md:grid md:grid-cols-12 md:items-center gap-x-6 gap-y-10">
        <div class="md:col-start-1 md:col-span-7 lg:col-span-6">
          <div class="wow fadeInLeft" data-wow-delay=".3s">
            <form
              class="contact px-15px py-30px md:px-5 lg:px-30px lg:py-10 xl:px-10 bg-white-color dark:bg-primary-color-light rounded-15px"
              (submit)="sendMessage($event)">
              <div class="text-center mb-25px">
                <h2
                  class="text-3xl md:text-size-35 lg:text-size-40 xl:text-size-45 bg-gradient-text-light dark:bg-gradient-text bg-clip-text xl:leading-1.2 text-transparent mb-15px">
                  Let's work together!
                </h2>
                <p class="text-primary-color-light dark:text-body-color wow fadeInLeft" data-wow-delay=".4s">
                  I build reliable web platforms, APIs, data dashboards, and AI features. Share your project details and I will get back to you.
                </p>
              </div>

              <div
                *ngIf="statusMessage"
                class="status-message show message-enter mb-5 rounded-lg px-4 py-3 text-size-15"
                [ngClass]="{
                  'bg-green-50 text-green-700 border border-green-200': statusType === 'success',
                  'bg-red-50 text-red-700 border border-red-200': statusType === 'error'
                }"
                aria-live="polite">
                {{ statusMessage }}
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-15px">
                <div class="form-field">
                  <input
                    name="firstName"
                    id="firstName"
                    type="text"
                    placeholder="First name *"
                    aria-label="First name"
                    required
                    class="text-primary-color-light dark:text-white-color w-full px-5 py-14px border border-gray-color-3 bg-cream-light-color dark:bg-black-color focus:border-primary-color rounded-lg outline-none focus:outline-none transition-all duration-300 placeholder:text-gray-color leading-1" />
                </div>

                <div class="form-field">
                  <input
                    name="lastName"
                    id="lastName"
                    type="text"
                    placeholder="Last name *"
                    aria-label="Last name"
                    required
                    class="text-primary-color-light dark:text-white-color w-full px-5 py-14px border border-gray-color-3 bg-cream-light-color dark:bg-black-color focus:border-primary-color rounded-lg outline-none focus:outline-none transition-all duration-300 placeholder:text-gray-color leading-1" />
                </div>

                <div class="form-field">
                  <input
                    name="email"
                    id="email"
                    type="email"
                    placeholder="Email address *"
                    aria-label="Email address"
                    required
                    class="text-primary-color-light dark:text-white-color w-full px-5 py-14px border border-gray-color-3 bg-cream-light-color dark:bg-black-color focus:border-primary-color rounded-lg outline-none focus:outline-none transition-all duration-300 placeholder:text-gray-color leading-1" />
                </div>

                <div class="form-field">
                  <input
                    name="phone"
                    id="phone"
                    type="tel"
                    placeholder="Phone number"
                    aria-label="Phone number"
                    class="text-primary-color-light dark:text-white-color w-full px-5 py-14px border border-gray-color-3 bg-cream-light-color dark:bg-black-color focus:border-primary-color rounded-lg outline-none focus:outline-none transition-all duration-300 placeholder:text-gray-color leading-1" />
                </div>

                <div class="form-field sm:col-start-1 sm:col-span-2">
                  <select
                    name="service"
                    id="service"
                    aria-label="Service"
                    class="tj-nice-select w-full px-5 py-14px border border-gray-color-3 bg-cream-light-color dark:bg-black-color focus:border-primary-color rounded-lg outline-none focus:outline-none transition-all duration-300 text-primary-color-light dark:text-white-color">
                    <option value="" disabled selected>Choose Service</option>
                    <option value="fullstack">Full-Stack Development</option>
                    <option value="architecture">Architecture & Microservices</option>
                    <option value="ai">AI, ML & Data Analytics</option>
                    <option value="devops">DevOps & Cloud Engineering</option>
                    <option value="other">Other</option>
                  </select>
                </div>

                <div class="form-field sm:col-start-1 sm:col-span-2">
                  <textarea
                    name="message"
                    id="message"
                    cols="1"
                    rows="10"
                    placeholder="Message *"
                    aria-label="Message"
                    required
                    class="text-primary-color-light dark:text-white-color w-full px-5 py-14px border border-gray-color-3 bg-cream-light-color dark:bg-black-color focus:border-primary-color rounded-lg outline-none focus:outline-none transition-all duration-300 placeholder:text-gray-color leading-1"></textarea>
                </div>

                <div class="sm:col-start-1 sm:col-span-2">
                  <button
                    type="submit"
                    [disabled]="isSending"
                    class="submit-button text-size-15 font-bold text-white-color capitalize py-17px px-35px bg-200 bg-gradient-secondary hover:bg-[-100%] rounded-full leading-1 transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center">
                    <span>{{ isSending ? 'Sending...' : 'Send Message' }}</span>
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>

        <div class="md:col-start-8 md:col-span-5">
          <div class="contact-info-list">
            <ul class="flex flex-col gap-y-10">
              <li class="flex flex-wrap items-center gap-25px position-relative wow fadeInRight" data-wow-delay=".4s">
                <div class="icon-box text-xl w-50px h-50px text-white-color flex justify-center items-center flex-col bg-gradient-primary-2 rounded-full leading-1">
                  <i class="flaticon-phone-call leading-1 mt-1"></i>
                </div>
                <div class="text-box">
                  <p class="text-primary-color-light dark:text-white-color mb-1">Phone</p>
                  <a href="tel:+21627448125" class="text-primary-color-light dark:text-white-color text-lg lg:text-xl font-medium hover:text-primary-color">
                    +216 27 448 125
                  </a>
                </div>
              </li>

              <li class="flex flex-wrap items-center gap-25px position-relative wow fadeInRight" data-wow-delay=".5s">
                <div class="icon-box text-xl w-50px h-50px text-white-color flex justify-center items-center flex-col bg-gradient-primary-2 rounded-full leading-1">
                  <i class="flaticon-mail-inbox-app leading-1 mt-1"></i>
                </div>
                <div class="text-box">
                  <p class="text-primary-color-light dark:text-white-color mb-1">Email</p>
                  <a href="mailto:oussama.bengamra@esprit.tn" class="text-primary-color-light dark:text-white-color text-lg lg:text-xl font-medium hover:text-primary-color">
                    oussama.bengamra&#64;esprit.tn
                  </a>
                </div>
              </li>

              <li class="flex flex-wrap items-center gap-25px position-relative wow fadeInRight" data-wow-delay=".6s">
                <div class="icon-box text-xl w-50px h-50px text-white-color flex justify-center items-center flex-col bg-gradient-primary-2 rounded-full leading-1">
                  <i class="flaticon-location leading-1 mt-1"></i>
                </div>
                <div class="text-box">
                  <p class="text-primary-color-light dark:text-white-color mb-1">Address</p>
                  <span class="text-primary-color-light dark:text-white-color text-lg lg:text-xl font-medium">
                    Tunis, Tunisia <br />
                    North Africa
                  </span>
                </div>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
